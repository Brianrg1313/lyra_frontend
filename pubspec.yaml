name: app
description: "Lyra"
publish_to: 'none'
version: 0.0.6+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  core:
    path: E:/andromeda/frontend/packages/core
  lyra_protocol:
    path: E:/andromeda/frontend/packages/lyra_protocol
  window_manager: ^0.5.1
  intl: any
  modal_bottom_sheet: ^3.0.0
  provider: ^6.1.5+1
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^11.0.0
  uuid: ^4.5.3
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  file_selector: ^1.1.0
  url_launcher: ^6.3.2
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  multicast_dns: ^0.3.3+1
  qr: ^4.0.0
  mobile_scanner: ^7.4.2
  web: ^1.1.1
  http: ^1.6.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/dark/
    - assets/images/light/

flutter_intl:
  enabled: true
